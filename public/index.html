<style>
/* Layout: an apothecary-style consultation. Quiet stone ground, serif questions, hairline rules;
   the result reads like a personal prescription card with illustrated product tiles. */
:root{
  --bg:#F1F0EC; --paper:#FBFAF7; --ink:#1D211E; --muted:#6E726C; --hair:#D9D7CF;
  --moss:#34503F; --moss-ink:#F6F4EE; --moss-soft:#E4E8E1; --gold:#A8875A; --gold-soft:#EFE7DA;
  --f-serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Cormorant Garamond","Noto Serif TC",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141715; --paper:#1B1F1C; --ink:#ECEAE3; --muted:#A3A69E; --hair:#30352F;
  --moss:#9DBBA6; --moss-ink:#141715; --moss-soft:#243029; --gold:#CDB088; --gold-soft:#2E2820; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141715; --paper:#1B1F1C; --ink:#ECEAE3; --muted:#A3A69E; --hair:#30352F;
  --moss:#9DBBA6; --moss-ink:#141715; --moss-soft:#243029; --gold:#CDB088; --gold-soft:#2E2820; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:300 16px/1.75 var(--f-sans);letter-spacing:.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:baseline;gap:10px;font:600 17px/1 var(--f-serif);letter-spacing:.08em}
.brand em{font:italic 500 15px/1 var(--f-num);color:var(--gold);letter-spacing:.04em}
.timer{font-size:12px;letter-spacing:.18em;color:var(--muted)}
p{margin:0}
h1,h2,h3{font-family:var(--f-serif);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.02em}
h1{font-size:clamp(32px,6vw,54px);line-height:1.25}
h2{font-size:clamp(24px,4vw,34px);line-height:1.4}
h2:focus{outline:none}
.label{font:500 12px/1 var(--f-sans);letter-spacing:.24em;color:var(--gold)}
.btn{appearance:none;border:1px solid var(--moss);border-radius:2px;padding:15px 30px;font:500 15px/1 var(--f-sans);letter-spacing:.14em;cursor:pointer;
  background:var(--moss);color:var(--moss-ink);display:inline-flex;align-items:center;gap:12px;text-decoration:none;transition:background .2s,color .2s}
.btn:hover{background:transparent;color:var(--moss)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--hair)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:disabled:hover{background:var(--moss);color:var(--moss-ink)}
.arrow{display:inline-block;width:22px;height:1px;background:currentColor;position:relative}
.arrow::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
/* intro */
.intro{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;padding-block:clamp(12px,5vw,48px)}
.intro .copy{display:flex;flex-direction:column;gap:24px;min-width:0}
.intro .lead{color:var(--muted);max-width:30em;font-size:16px}
.dial{position:relative;aspect-ratio:1;max-width:320px;width:100%;justify-self:center}
.dial svg{width:100%;height:100%;display:block}
.dial .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dial .num b{font:500 clamp(84px,14vw,128px)/.9 var(--f-num);color:var(--ink)}
.dial .num span{font:400 13px/1 var(--f-sans);letter-spacing:.3em;color:var(--muted)}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--hair);margin-top:8px}
.steps3 div{padding:16px 14px 0 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.steps3 div+div{padding-left:14px;border-left:1px solid var(--hair)}
.steps3 b{font:500 26px/1 var(--f-num);color:var(--moss)}
.steps3 span{font-size:13px;color:var(--muted);line-height:1.5}
@media (max-width:680px){.intro{grid-template-columns:1fr;gap:24px}.dial{max-width:200px;order:-1}}
/* question */
.q{display:flex;flex-direction:column;gap:28px;max-width:680px;margin:0 auto;width:100%;padding-block:clamp(8px,3vw,32px)}
.prog{display:flex;align-items:center;gap:16px}
.prog .n{font:500 22px/1 var(--f-num);font-variant-numeric:lining-nums tabular-nums;min-width:4.2em}
.prog .n small{font-size:15px;color:var(--muted)}
.bar{flex:1;height:1px;background:var(--hair);position:relative}
.bar i{position:absolute;left:0;top:-1px;height:3px;background:var(--moss);transition:width .35s ease}
.qhead{display:flex;flex-direction:column;gap:10px}
.hint{color:var(--muted);font-size:14px}
.opts{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.opts.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
.opts.grid .opt{border-bottom:1px solid var(--hair)}
@media (max-width:560px){.opts.grid{grid-template-columns:1fr}}
.opt{appearance:none;background:transparent;border:0;border-bottom:1px solid var(--hair);text-align:left;color:var(--ink);
  font:400 17px/1.5 var(--f-sans);padding:18px 6px;cursor:pointer;display:flex;gap:18px;align-items:center;min-width:0;transition:padding .2s,background .2s}
.opt:hover{padding-left:14px;background:var(--paper)}
.opt .k{flex:none;width:28px;height:28px;border:1px solid var(--hair);border-radius:50%;display:grid;place-items:center;
  font:italic 500 16px/1 var(--f-num);color:var(--muted);transition:all .2s}
.opt[aria-pressed="true"]{background:var(--paper);padding-left:14px}
.opt[aria-pressed="true"] .k{background:var(--moss);border-color:var(--moss);color:var(--moss-ink);font-style:normal}
.opt small{display:block;color:var(--muted);font-size:13px;font-weight:300}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.back{appearance:none;background:none;border:0;color:var(--muted);font:400 14px var(--f-sans);letter-spacing:.12em;cursor:pointer;padding:8px 0}
.back:hover{color:var(--ink)}
/* result */
.res{display:flex;flex-direction:column;gap:40px}
.rx{display:grid;grid-template-columns:1fr 280px;gap:36px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--hair)}
.rx .copy{display:flex;flex-direction:column;gap:14px;min-width:0}
.rx .sub{color:var(--muted)}
.meters{display:flex;flex-direction:column;gap:12px}
.meter{display:grid;grid-template-columns:5.5em 1fr;gap:12px;align-items:center;font-size:13px}
.meter .t{height:2px;background:var(--hair);position:relative}
.meter .t i{position:absolute;left:0;top:-1px;height:4px;background:var(--moss)}
.meter:first-child .t i{background:var(--gold)}
.speed{font-size:12px;letter-spacing:.14em;color:var(--muted)}
@media (max-width:680px){.rx{grid-template-columns:1fr;gap:24px}}
.feature{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:clamp(20px,4vw,44px);background:var(--paper);border:1px solid var(--hair);padding:clamp(18px,3.5vw,36px)}
.feature .tile{aspect-ratio:1}
@media (max-width:680px){.feature{grid-template-columns:1fr}.feature .tile{aspect-ratio:4/3}}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:680px){.pair{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--hair);padding:clamp(16px,2.6vw,24px);display:flex;flex-direction:column;gap:16px;min-width:0}
.card .tile{aspect-ratio:16/10}
.tile,.mini{--tint-bg:color-mix(in srgb,var(--tint) 12%,var(--paper))}
.tile{position:relative;overflow:hidden;background:var(--tint-bg);display:grid;place-items:center;width:100%}
.tile svg{width:62%;height:78%;display:block}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:8%}
.tile .tag{position:absolute;left:12px;top:12px;font-size:11px;letter-spacing:.2em;color:var(--ink);background:var(--paper);padding:4px 8px;z-index:1}
.pbody{display:flex;flex-direction:column;gap:14px;min-width:0}
.rank{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rank .label{color:var(--muted)}
.feature .rank .label{color:var(--gold)}
.match{font:500 30px/1 var(--f-num);color:var(--moss)}
.match small{font:400 11px var(--f-sans);letter-spacing:.16em;color:var(--muted);margin-left:6px}
.card .match{font-size:24px}
.pname{font:600 clamp(19px,2.6vw,24px)/1.45 var(--f-serif);letter-spacing:.02em}
.card .pname{font-size:18px}
.vendor{font-size:12px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.why{margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.why li{list-style:none;display:flex;gap:10px;align-items:baseline}
.why li::before{content:"";flex:none;width:12px;height:1px;background:var(--gold);transform:translateY(-4px)}
.quote{font:400 14px/1.8 var(--f-serif);color:var(--muted);padding-top:14px;border-top:1px solid var(--hair)}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:auto}
.price{font:500 24px/1 var(--f-num);font-variant-numeric:lining-nums tabular-nums}
.price small{font:300 12px var(--f-sans);color:var(--muted);margin-left:4px}
.link{color:var(--ink);font:500 14px/1 var(--f-sans);letter-spacing:.12em;text-decoration:none;display:inline-flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ink)}
.link:hover{color:var(--moss);border-color:var(--moss)}
.more{display:flex;flex-direction:column}
.more h3{font-size:18px;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.more a{display:grid;grid-template-columns:44px 1fr auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--hair);color:var(--ink);text-decoration:none}
.more a:hover .mn{color:var(--moss)}
.more .mini{width:44px;height:44px;background:var(--tint-bg);display:grid;place-items:center}
.more .mini svg{width:70%;height:80%}
.mn{min-width:0;font-size:15px;line-height:1.5}
.mn span{display:block;font-size:12px;color:var(--muted);letter-spacing:.1em}
.more .price{font-size:19px}
.closing{display:grid;grid-template-columns:1fr;gap:20px;align-items:stretch}

.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.note{font-size:12px;line-height:1.8;color:var(--muted)}

a.tile{text-decoration:none;cursor:pointer}

.dealh{font:600 clamp(19px,3vw,24px)/1.6 var(--f-serif);letter-spacing:.02em}
.dealh b{color:var(--moss);font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:400 15px var(--f-sans);color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--moss);font-weight:500}
.rtable-wrap{overflow-x:auto;margin-top:8px}
.rtable{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
.rtable th{text-align:left;font-weight:500;font-size:12px;letter-spacing:.12em;color:var(--muted);padding:8px 10px 8px 0;border-bottom:1px solid var(--hair)}
.rtable td{padding:10px 10px 10px 0;border-bottom:1px solid var(--hair);vertical-align:top}
.rtable td.num{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.rtable a{color:var(--moss)}
details.edit{border-top:1px solid var(--hair);padding-top:14px}
details.edit summary{cursor:pointer;font:600 17px var(--f-serif)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:12px 22px;font-size:14px;letter-spacing:.06em;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.fade{animation:fade .45s cubic-bezier(.2,.7,.2,1)}
@keyframes fade{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar i,.opt{transition:none}}
</style>

function pick(q,k){
  if(q.multi){
    let a = ans[q.id] ? ans[q.id].slice() : [];
    if(a.includes(k)) a=a.filter(x=>x!==k);
    else { a.push(k); if(a.length>q.multi) a.shift(); }
    ans[q.id]=a;
    if(!visible().some(x=>x.id==="skin")) delete ans.skin;
    render();
    const b=app.querySelector(`.opt[data-k="${k}"]`); if(b) b.focus({preventScroll:true});
  } else {
    ans[q.id]=k; render();
    setTimeout(()=>go(i+1),220);
  }
}

/* ---------- scoring: runs in the browser, takes about 1 ms ---------- */
function score(){
  const need = {}, why = {};
  const bump=(tag,v,reason)=>{need[tag]=(need[tag]||0)+v; if(reason){(why[tag]=why[tag]||[]).push(reason)}};
  (ans.goal||[]).forEach((k,ix)=>{const tag=Q[1].opts[k].tag; bump(tag, [5,4,3][ix]||3, GOAL_WHY[tag]);});
  for(const q of visible()){
    if(q.id==="goal"||q.id==="budget"||ans[q.id]===undefined) continue;
    const ks = q.multi ? ans[q.id] : [ans[q.id]];
    for(const k of ks){ const o=q.opts[k]; for(const [tag,v] of Object.entries(o.add||{})) bump(tag,v,o.why); }
  }
  const budget = Q[Q.length-1].opts[ans.budget]?.b || "any";
  const ranked = P.map(p=>{
    let s=0; const contrib=[];
    for(const [tag,w] of Object.entries(p.t)){ const c=(need[tag]||0)*w; if(c>0){s+=c;contrib.push([tag,c]);} }
    if(budget==="single"){ if(p.p<=1500) s*=1.15; if(p.p>3000) s*=.6; }
    if(budget==="kit"){ if(p.kit) s*=1.25; }
    contrib.sort((a,b)=>b[1]-a[1]);
    const main = Object.entries(p.t).sort((a,b)=>b[1]-a[1])[0][0];
    return {p,s,main:contrib[0]?.[0]||main,home:main,contrib};
  }).filter(r=>r.s>0).sort((a,b)=>b.s-a.s);
  const picks=[], used={};
  const fam=t=>t.startsWith("s_")?"skin":t;
  for(const r of ranked){ if(picks.length>=3) break; const f=fam(r.main); if(!used[f]){picks.push(r);used[f]=1;} }
  for(const r of ranked){ if(picks.length>=3) break; if(!picks.includes(r)) picks.push(r); }
  const rest = ranked.filter(r=>!picks.includes(r)).slice(0,4);
  const max = picks[0]?.s || 1;
  const needs = Object.entries(need).filter(([t])=>!t.startsWith("s_")).sort((a,b)=>b[1]-a[1]).slice(0,4);
  return {need,why,picks,rest,max,needs,budget};
}

function reasons(r,why){
  const out=[];
  for(const [tag] of r.contrib){ for(const w of (why[tag]||[])){ if(!out.includes(w)) out.push(w); if(out.length>=2) break;} if(out.length>=2) break; }
  if(!out.length) out.push(`對應你的「${NEED[r.main]}」需求`);
  return out;
}

      </div>
      <div class="meters" aria-label="你的保養重點">
        ${R.needs.map(([t,v])=>`<div class="meter"><span>${esc(NEED[t])}</span><span class="t"><i style="width:${Math.round(v/nmax*100)}%"></i></span></div>`).join("")}
      </div>
    </div>
    ${a?`<article class="feature">${tile(a)}${body(a,0,true)}</article>`:""}
    ${others.length?`<div class="pair">${others.map((r,ix)=>`<article class="card">${tile(r)}${body(r,ix+1,false)}</article>`).join("")}</div>`:""}
    ${R.rest.length?`<div class="more"><h3>也可以考慮</h3>${R.rest.map(r=>`<a href="${purl(r.p.h)}" target="_blank" rel="noopener"><span class="mini" style="${tintStyle(r)}">${art(FORM[r.p.h],"")}</span><span class="mn">${esc(r.p.n)}<span>${esc(NEED[r.main])}</span></span><span class="price">${money(r.p.p)}</span></a>`).join("")}</div>`:""}
    ${deal(R)}
    <div class="closing">
      <div class="sync" style="justify-content:space-between">
        <span class="label">SHARE</span>
        <p class="note">${STORE?`<span class="status" id="ms">正在把結果傳送給你的顧問 ${esc(STORE.s)}…</span>`:"把結果複製下來，傳給你的健康顧問或朋友。"}</p>
        <div class="actions"><button class="btn" id="copy">複製我的結果</button><button class="back" id="again">重新測驗</button></div>
      </div>
    </div>
  </section>`;
  document.getElementById("again").onclick=intro;
  document.getElementById("copy").onclick=()=>copy(record);
  document.getElementById("ask").onclick=()=>copyText(askText(),"已複製，貼給你的顧問就可以了");
  if(STORE && !record._sent){
    const ms=document.getElementById("ms");
    const okMsg=()=>{ms.className="status ok";ms.textContent=`已把結果傳送給你的顧問 ${STORE.s}，顧問會再跟你聯絡。`};
    const failMsg=()=>{ms.textContent="結果沒有傳送成功。請按「複製我的結果」，再傳給你的顧問。"};
    const qa={}; visible().forEach(q=>{ const v=record.answers[q.id]; if(v&&(!Array.isArray(v)||v.length)) qa[q.title]=v; });
    record._sent=true;
    const legacy=()=>{
    const data={_subject:`【健康選品｜${STORE.s}】${custName} 的測驗結果`,_template:"table",_captcha:"false",
      "店舖":STORE.s,"顧客姓名":custName,"測驗時間":new Date().toLocaleString("zh-TW",{hour12:false}),"保養重點":record.focus.join("、")};
    record.recommendations.forEach((r,ix)=>data[`推薦 ${ix+1}`]=`${r.name}（符合 ${r.match}%） ${r.url}`);
    visible().forEach(q=>{ const v=record.answers[q.id]; if(v) data["作答｜"+q.title]=Array.isArray(v)?v.join("、"):v; });
    return sendMail(STORE.m,data).then(okMsg,failMsg); };
    (API_ON?api("/api/results",{method:"POST",body:JSON.stringify({store:STORE.s,customer:custName,focus:record.focus,recommendations:record.recommendations,answers:qa})}):Promise.reject({code:"noapi"}))
      .then(j=>{ if(j.store||!STORE.m) okMsg(); else legacy(); })
      .catch(()=>{ if(STORE.m) legacy(); else failMsg(); });
  }
  window.scrollTo({top:0}); app.querySelector("h2").focus({preventScroll:true});
}

const DEAL_LINES = [
  n=>`健康無價，但優惠可以有價 😆<br>跟 <b>${n}</b> 撒個嬌、要一下優惠吧，相信${n}不會讓你失望的！`,
  n=>`偷偷告訴你：只要說一句「我做完測驗了」，<br><b>${n}</b> 很可能就心軟給你優惠了 🤫`,
  n=>`還在猶豫嗎？猶豫的時候最適合做一件事：<br>跟 <b>${n}</b> 討個優惠 🙌`
];
function deal(R){
  const n = STORE ? esc(STORE.s) : "介紹你來的顧問";
  const line = DEAL_LINES[Math.floor(Math.random()*DEAL_LINES.length)](n);
  return `<div class="deal">
    <span class="label">SPECIAL OFFER</span>
    <p class="dealh">${line}</p>
    <p class="note">不急著決定也完全沒關係，先把結果收著，想清楚了再找${n}聊聊就好。</p>
    <div class="actions">
      ${STORE&&STORE.l?`<a class="btn" href="${STORE.l.startsWith("@")?"https://line.me/R/ti/p/"+encodeURIComponent(STORE.l):"https://line.me/ti/p/~"+encodeURIComponent(STORE.l)}" target="_blank" rel="noopener">用 LINE 要優惠 ${ARROW}</a>`:""}
      <button class="${STORE&&STORE.l?"btn ghost":"btn"}" id="ask">複製「要優惠」訊息</button>
    </div>
  </div>`;
}
function askText(){
  const r=window.quizResult, top=r?.recommendations?.[0]?.name||"推薦的產品";
  return `嗨${STORE?" "+STORE.s:""}～我是${custName||"剛做完健康測驗的朋友"}，剛做完健康測驗，系統推薦我「${top}」。聽說找你可以拿到優惠？拜託拜託 🙏`;
}
function copy(rec){
  const txt = `【健康選品 測驗結果】\n保養重點：${rec.focus.join("、")}\n` +
    rec.recommendations.map((r,ix)=>`${ix+1}. ${r.name}（符合 ${r.match}%）\n   ${r.url}`).join("\n");
  const done=()=>toast("已複製，可以貼給你的顧問或朋友");
  if(navigator.clipboard?.writeText){ navigator.clipboard.writeText(txt).then(done,()=>fallback(txt)); } else fallback(txt);
}
function copyText(txt,msg){ if(navigator.clipboard?.writeText){ navigator.clipboard.writeText(txt).then(()=>toast(msg),()=>fallback(txt)); } else fallback(txt); }
function fallback(txt){
  const ta=document.createElement("textarea"); ta.value=txt; ta.setAttribute("readonly",""); ta.style.cssText="position:fixed;opacity:0";
  document.body.appendChild(ta); ta.select(); let ok=false; try{ok=document.execCommand("copy")}catch(e){}
  ta.remove(); toast(ok?"已複製":"無法自動複製，請手動選取");
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2200)}

document.addEventListener("keydown",e=>{
  if(i<0||e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA/.test(e.target.tagName)) return; const q=visible()[i]; if(!q||e.key.length!==1) return;
  const k=e.key.toLowerCase().charCodeAt(0)-97;
  if(k>=0 && k<q.opts.length){ pick(q,k); }
});

if(!STORE && location.hash==="#owner") setup(); else intro();
})();
</script>
